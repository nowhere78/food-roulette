  <circle cx="256" cy="256" r="190" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.5"/>
  
  <!-- Wheel Segments -->
  <line x1="256" y1="66" x2="256" y2="446" stroke="#f43f5e" stroke-width="6"/>
