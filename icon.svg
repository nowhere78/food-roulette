  <line x1="122" y1="122" x2="390" y2="390" stroke="#3b82f6" stroke-width="6"/>
  <line x1="122" y1="390" x2="390" y2="122" stroke="#3b82f6" stroke-width="6"/>
  
  <!-- Outer glowing dots for roulette style -->
  <circle cx="256" cy="36" r="10" fill="#f59e0b"/>
  <circle cx="411" cy="101" r="10" fill="#f59e0b"/>
  <circle cx="476" cy="256" r="10" fill="#f59e0b"/>
  <circle cx="411" cy="411" r="10" fill="#f59e0b"/>
  <circle cx="256" cy="476" r="10" fill="#f59e0b"/>
  <circle cx="101" cy="411" r="10" fill="#f59e0b"/>
  <circle cx="36" cy="256" r="10" fill="#f59e0b"/>
  <circle cx="101" cy="101" r="10" fill="#f59e0b"/>

  <!-- Center Hub -->
